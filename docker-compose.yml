version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: portaldel_egresado_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: egresados_db
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Microservicio 1: Autenticación (puerto 8002) ──────────────────────────
  auth:
    build:
      context: ./backend
      dockerfile: ./app/auth/Dockerfile
    container_name: portaldel_egresado_auth
    command: uvicorn app.auth.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/egresados_db
      SECRET_KEY: ${SECRET_KEY:-cambia_esto_en_produccion_usa_32_chars}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

  # ── Microservicio 2: Empresas y Vacantes (puerto 8001) ───────────────────
  companies:
    build:
      context: ./backend
      dockerfile: ./app/companies/Dockerfile
    container_name: portaldel_egresado_companies
    command: uvicorn app.companies.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/egresados_db
      SECRET_KEY: ${SECRET_KEY:-cambia_esto_en_produccion_usa_32_chars}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      MATCHMAKING_URL: http://matchmaking:8000
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    volumes:
      - ./backend/app:/app/app

  # ── Microservicio 3: Egresados (puerto 8003) ─────────────────────────────
  graduates:
    build:
      context: ./backend
      dockerfile: ./app/graduates/Dockerfile
    container_name: portaldel_egresado_graduates
    command: uvicorn app.graduates.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/egresados_db
      SECRET_KEY: ${SECRET_KEY:-cambia_esto_en_produccion_usa_32_chars}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      MATCHMAKING_URL: http://matchmaking:8000
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: cvs
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    volumes:
      - ./backend/app:/app/app
  
  # ── Microservicio 4: Dashboard Administrativo (puerto 8004) ─────────────
  dashboard:
    build:
      context: ./backend
      dockerfile: ./app/dashboard/Dockerfile
    container_name: portaldel_egresado_dashboard
    command: uvicorn app.dashboard.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8004:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/egresados_db
      SECRET_KEY: ${SECRET_KEY:-cambia_esto_en_produccion_usa_32_chars}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
      companies:
        condition: service_started
      graduates:
        condition: service_started
    volumes:
      - ./backend/app:/app/app

  # ── Microservicio 5: Matchmaking (puerto 8005) ───────────────────────────
  matchmaking:
    build:
      context: ./backend
    container_name: portaldel_egresado_matchmaking
    command: uvicorn app.matchmaking.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8005:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/egresados_db
      SECRET_KEY: ${SECRET_KEY:-cambia_esto_en_produccion_usa_32_chars}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    volumes:
      - ./backend:/app

  # ── MinIO para Almacenamiento de Archivos (S3) ─────────────────────────
  minio:
    image: minio/minio
    container_name: portaldel_egresado_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
  # ── Frontend React (puerto 5176) ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    container_name: portaldel_egresado_frontend
    ports:
      - "5176:5176"
    environment:
      VITE_AUTH_URL: http://localhost:8002
      VITE_COMPANIES_URL: http://localhost:8001
      VITE_GRADUATES_URL: http://localhost:8003
      VITE_DASHBOARD_URL: http://localhost:8004
      VITE_MATCHMAKING_URL: http://localhost:8005
    depends_on:
      - auth
      - companies
      - graduates
      - matchmaking
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
  minio_data: