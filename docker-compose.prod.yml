version: '3.8'

services:
  db:
    image: root733/postgres:15-alpine
    container_name: portaldel_egresado_db_prod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: egresados_db
    ports:
      - "5434:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      # El profesor necesitará este archivo init.sql en la carpeta backend para inicializar la BD
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth:
    image: root733/portaldelegresado-auth:latest
    container_name: portaldel_egresado_auth_prod
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/egresados_db
      SECRET_KEY: ${SECRET_KEY:-cambia_esto_en_produccion_usa_32_chars}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      FRONTEND_URL: http://localhost:5176
    depends_on:
      db:
        condition: service_healthy

  companies:
    image: root733/portaldelegresado-companies:latest
    container_name: portaldel_egresado_companies_prod
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/egresados_db
      SECRET_KEY: ${SECRET_KEY:-cambia_esto_en_produccion_usa_32_chars}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      MATCHMAKING_URL: http://matchmaking:8000
      MATCHMAKING_INTERNAL_TOKEN: ${MATCHMAKING_INTERNAL_TOKEN:-token_interno_servicios}
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started

  graduates:
    image: root733/portaldelegresado-graduates:latest
    container_name: portaldel_egresado_graduates_prod
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/egresados_db
      SECRET_KEY: ${SECRET_KEY:-cambia_esto_en_produccion_usa_32_chars}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      MATCHMAKING_URL: http://matchmaking:8000
      MATCHMAKING_INTERNAL_TOKEN: ${MATCHMAKING_INTERNAL_TOKEN:-token_interno_servicios}
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: cvs
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started

  dashboard:
    image: root733/portaldelegresado-dashboard:latest
    container_name: portaldel_egresado_dashboard_prod
    ports:
      - "8004:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/egresados_db
      SECRET_KEY: ${SECRET_KEY:-cambia_esto_en_produccion_usa_32_chars}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
      companies:
        condition: service_started
      graduates:
        condition: service_started

  matchmaking:
    image: root733/portaldelegresado-matchmaking:latest
    container_name: portaldel_egresado_matchmaking_prod
    ports:
      - "8005:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/egresados_db
      SECRET_KEY: ${SECRET_KEY:-cambia_esto_en_produccion_usa_32_chars}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      MATCHMAKING_INTERNAL_TOKEN: ${MATCHMAKING_INTERNAL_TOKEN:-token_interno_servicios}
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started

  minio:
    image: root733/minio:latest
    container_name: portaldel_egresado_minio_prod
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data_prod:/data

  frontend:
    image: root733/portaldelegresado-frontend:latest
    container_name: portaldel_egresado_frontend_prod
    ports:
      - "5176:5176"
    environment:
      VITE_AUTH_URL: http://localhost:8002
      VITE_COMPANIES_URL: http://localhost:8001
      VITE_GRADUATES_URL: http://localhost:8003
      VITE_DASHBOARD_URL: http://localhost:8004
      VITE_MATCHMAKING_URL: http://localhost:8005
    depends_on:
      - auth
      - companies
      - graduates
      - matchmaking

volumes:
  pgdata_prod:
  minio_data_prod:
